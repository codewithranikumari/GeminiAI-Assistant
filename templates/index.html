
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI Chat</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #0c1020;
    --panel: #151b2e;
    --border: #2a3450;
    --text: #edf0ff;
    --muted: #a4aec8;
    --accent: #8b9cff;
}

body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 250px;
    flex-shrink: 0;
    background: #101629;
    border-right: 1px solid var(--border);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.brand {
    font-size: 21px;
    font-weight: 700;
    padding: 8px 4px 18px;
}

.new-chat {
    border: 1px solid #455277;
    color: white;
    background: #202a43;
    border-radius: 12px;
    padding: 13px;
    cursor: pointer;
    font-size: 14px;
}

.new-chat:hover { background: #2b3857; }

.sidebar-info {
    margin-top: auto;
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
    overflow-wrap: anywhere;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
}

.topbar span {
    color: var(--accent);
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 18px;
}

.inner {
    max-width: 780px;
    margin: 0 auto;
}

.welcome {
    text-align: center;
    padding: 12vh 10px 25px;
}

.logo {
    font-size: 44px;
    margin-bottom: 12px;
}

.welcome h1 {
    font-size: clamp(26px, 4vw, 38px);
    margin: 10px 0;
}

.welcome p {
    color: var(--muted);
    line-height: 1.7;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 30px;
}

.suggestion {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
}

.suggestion:hover {
    border-color: var(--accent);
}

.message {
    display: flex;
    gap: 12px;
    margin: 20px 0;
    align-items: flex-start;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    display: grid;
    place-items: center;
    background: #293452;
    border-radius: 50%;
}

.content {
    line-height: 1.75;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding-top: 4px;
}

.composer-area {
    padding: 12px 18px 22px;
    background: linear-gradient(transparent, var(--bg) 25%);
}

.composer {
    max-width: 780px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px;
    border: 1px solid #394765;
    background: #171e32;
    border-radius: 18px;
    box-shadow: 0 10px 35px #0003;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    max-height: 150px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font: inherit;
    padding: 10px;
}

textarea::placeholder { color: #8f9bb9; }

.send {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #101629;
    font-size: 20px;
    cursor: pointer;
}

.send:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.note {
    text-align: center;
    color: #8d99b5;
    font-size: 11px;
    margin-top: 10px;
}

@media (max-width: 650px) {
    .sidebar { display: none; }
    .topbar { padding: 16px; }
    .chat { padding: 16px 12px; }
    .suggestions { grid-template-columns: 1fr; }
    .welcome { padding-top: 7vh; }
}
</style>
</head>

<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">✨ Gemini AI</div>
        <button class="new-chat" onclick="newChat()">＋ New chat</button>
        <div class="sidebar-info">
            Powered by Google Gemini<br>
            Your AI assistant<br><br>
            Keep your API key private.
        </div>
    </aside>

    <main class="main">
        <header class="topbar">Gemini <span>AI Assistant</span></header>

        <section class="chat" id="chat">
            <div class="inner" id="messages">
                <div class="welcome" id="welcome">
                    <div class="logo">✦</div>
                    <h1>How can I help you today?</h1>
                    <p>Ask a question, explore an idea, or learn something new.</p>

                    <div class="suggestions">
                        <button class="suggestion"
                          onclick="useSuggestion('Explain Python with examples')">
                          💻 <b>Learn Python</b><br><br>
                          <small>Understand coding basics</small>
                        </button>
                        <button class="suggestion"
                          onclick="useSuggestion('Help me prepare a study plan')">
                          📚 <b>Study planner</b><br><br>
                          <small>Organize your learning</small>
                        </button>
                        <button class="suggestion"
                          onclick="useSuggestion('Give me creative project ideas')">
                          💡 <b>Get ideas</b><br><br>
                          <small>Brainstorm something new</small>
                        </button>
                        <button class="suggestion"
                          onclick="useSuggestion('Write a professional email example')">
                          ✍️ <b>Write something</b><br><br>
                          <small>Create and improve text</small>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <footer class="composer-area">
            <form class="composer" id="form">
                <textarea id="input" rows="1"
                    placeholder="Message Gemini..."
                    aria-label="Your message"></textarea>
                <button class="send" id="send" type="submit">↑</button>
            </form>
            <div class="note">AI can make mistakes. Verify important information.</div>
        </footer>
    </main>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const chat = document.getElementById("chat");

let history = [];
let busy = false;

function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
}

function addMessage(role, text) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const row = document.createElement("div");
    row.className = "message";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "✨";

    const content = document.createElement("div");
    content.className = "content";
    // textContent prevents HTML from API responses being executed.
    content.textContent = text;

    row.append(avatar, content);
    messages.appendChild(row);
    scrollBottom();

    return content;
}

async function sendMessage(text) {
    if (busy || !text.trim()) return;

    busy = true;
    send.disabled = true;
    addMessage("user", text);

    const thinking = addMessage("assistant", "Thinking...");

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: text,
                history: history
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.details || data.error || "Request failed");
        }

        thinking.textContent = data.reply;

        history.push(
            {role: "user", text: text},
            {role: "model", text: data.reply}
        );

    } catch (error) {
        thinking.textContent = "Sorry, an error occurred: " + error.message;
    } finally {
        busy = false;
        send.disabled = false;
        input.focus();
        scrollBottom();
    }
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;

    input.value = "";
    input.style.height = "auto";
    await sendMessage(text);
});

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
    }
});

function useSuggestion(text) {
    input.value = text;
    form.requestSubmit();
}

function newChat() {
    if (busy) return;
    history = [];
    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="logo">✦</div>
            <h1>How can I help you today?</h1>
            <p>Start a new conversation with Gemini AI.</p>
        </div>`;
    input.value = "";
    input.focus();
}
</script>
</body>
</html>
